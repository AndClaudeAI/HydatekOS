<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 60" width="250" height="150" color="#8e44ad">
  <style>
    .card { fill: #fdfaf4; stroke: #c9b99a; stroke-width: 1 }
    #badge { fill: #27ae60 }
    circle.dot { fill: currentColor }
  </style>
  <defs>
    <symbol id="star" viewBox="0 0 10 10"><path d="M5 0 L6.2 3.6 L10 3.8 L7 6.1 L8.1 9.8 L5 7.6 L1.9 9.8 L3 6.1 L0 3.8 L3.8 3.6Z"/></symbol>
    <g id="pair"><rect width="8" height="8" fill="#e74c3c"/><rect x="10" width="8" height="8" fill="#3498db"/></g>
  </defs>
  <rect class="card" x="2" y="2" width="96" height="56" rx="4"/>
  <circle id="badge" cx="15" cy="15" r="8"/>
  <circle class="dot" cx="35" cy="15" r="5"/>
  <use xlink:href="#star" x="50" y="6" width="18" height="18" fill="#f1c40f"/>
  <use href="#pair" x="72" y="10"/>
  <g transform="translate(10 32) rotate(-10) scale(1.2)" opacity="0.6">
    <rect width="30" height="15" fill="#2c3e50"/>
    <rect x="15" y="5" width="30" height="15" fill="#e67e22"/>
  </g>
  <g transform="skewX(20)"><rect x="55" y="35" width="20" height="15" fill="#1abc9c"/></g>
  <svg x="80" y="34" width="16" height="16" viewBox="0 0 2 2"><rect width="1" height="1" fill="#555"/><rect x="1" y="1" width="1" height="1" fill="#555"/></svg>
  <rect x="2" y="54" width="96" height="1" fill="#c9b99a" display="none"/>
</svg>
